
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Simulation App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="atm-container">
        <h1>🏧 ATM MACHINE</h1>
        <p class="subtitle">Welcome to Your ATM</p>

        <div class="screen">
            <h2>ATM Services</h2>
            <p id="message">Please select an option</p>
            <h3 id="balance">Balance: Rs. 10,000</h3>
        </div>

        <div class="buttons">
            <button onclick="checkBalance()">Check Balance</button>
            <button onclick="depositMoney()">Deposit Money</button>
            <button onclick="withdrawMoney()">Withdraw Money</button>
            <button onclick="exitATM()">Exit ATM</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
